<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#133824">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="A. Keopi POS">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <title>A. Keopi Cafe POS</title>
  <style>
    :root {
      --cream: #fdfbf7;
      --green: #133824;
      --gold: #c89b4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--cream);
      color: var(--green);
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      opacity: 0;
      transform: scale(0.985);
      transition: opacity 700ms ease, transform 700ms ease;
    }

    body.app-ready {
      overflow: auto;
    }

    body.app-ready .app {
      opacity: 1;
      transform: scale(1);
    }

    .app-card {
      text-align: center;
    }

    .app-card h1 {
      margin: 12px 0 4px;
      font-size: clamp(28px, 6vw, 48px);
    }

    .app-card p {
      margin: 0;
      color: #6b6253;
    }

    .install-app {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 900;
      display: none;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--green);
      color: white;
      font: 700 14px Arial, sans-serif;
      box-shadow: 0 10px 28px rgba(19, 56, 36, 0.24);
      cursor: pointer;
    }

    .install-app.visible {
      display: flex;
      animation: installReveal 400ms ease both;
    }

    @keyframes installReveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .opening-animation {
      position: fixed;
      inset: 0;
      z-index: 1000;
      display: grid;
      place-items: center;
      background:
        radial-gradient(circle at 50% 42%, rgba(200, 155, 75, 0.17), transparent 24%),
        var(--cream);
      transition: opacity 800ms cubic-bezier(.4, 0, .2, 1), visibility 800ms ease;
    }

    .opening-animation.finish {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .opening-mark {
      display: grid;
      justify-items: center;
      gap: 10px;
      animation: openingReveal 1.55s cubic-bezier(.2,.75,.25,1) both;
    }

    .opening-progress {
      position: absolute;
      left: 50%;
      bottom: clamp(34px, 8vh, 72px);
      width: min(180px, 46vw);
      height: 3px;
      overflow: hidden;
      border-radius: 999px;
      background: rgba(19, 56, 36, 0.10);
      transform: translateX(-50%);
    }

    .opening-progress::before {
      content: "";
      position: absolute;
      inset: 0;
      border-radius: inherit;
      background: linear-gradient(90deg, var(--gold), #e4c27d, var(--gold));
      transform-origin: left;
      animation: loadingProgress 2.35s cubic-bezier(.25, .8, .25, 1) both;
    }

    .logo-wrap {
      position: relative;
      width: clamp(150px, 38vw, 230px);
      aspect-ratio: 1;
      display: grid;
      place-items: center;
      border-radius: 50%;
      filter: drop-shadow(0 18px 24px rgba(19, 56, 36, 0.16));
    }

    .logo-wrap img {
      position: relative;
      z-index: 2;
      width: 82%;
      height: 82%;
      object-fit: contain;
      border-radius: 50%;
      animation: logoPop 1.15s 220ms cubic-bezier(.2, .8, .25, 1) both;
    }

    .logo-wrap::before {
      content: "";
      position: absolute;
      inset: 5%;
      border: 2px solid rgba(200, 155, 75, 0.7);
      border-radius: 50%;
      box-shadow:
        0 0 0 7px rgba(200, 155, 75, 0.08),
        0 0 35px rgba(200, 155, 75, 0.14);
      transform: scale(0.72);
      opacity: 0;
      animation: ringReveal 1.35s 180ms ease-out forwards;
    }

    .logo-wrap::after {
      content: "";
      position: absolute;
      inset: -8%;
      border: 1px solid transparent;
      border-top-color: var(--gold);
      border-right-color: rgba(200, 155, 75, 0.25);
      border-radius: 50%;
      animation: slowSpin 3.2s 500ms linear infinite;
    }

    .brand-name {
      font-family: Georgia, serif;
      font-size: clamp(24px, 7vw, 38px);
      font-weight: 700;
      letter-spacing: 0.06em;
      opacity: 0;
      transform: translateY(12px);
      animation: textReveal 700ms 650ms ease forwards;
    }

    .brand-tagline {
      color: var(--gold);
      font-size: clamp(11px, 3vw, 14px);
      letter-spacing: 0.28em;
      text-transform: uppercase;
      opacity: 0;
      transform: translateY(8px);
      animation: textReveal 700ms 900ms ease forwards;
    }

    .steam {
      position: absolute;
      top: 9%;
      left: 50%;
      width: 8px;
      height: 34px;
      border-radius: 50%;
      background: rgba(200, 155, 75, 0.32);
      filter: blur(3px);
      opacity: 0;
      animation: steamRise 1.8s 350ms ease-in-out infinite;
    }

    .steam.second {
      left: calc(50% + 18px);
      height: 28px;
      animation-delay: 650ms;
    }

    .coffee-bean {
      position: absolute;
      width: 7px;
      height: 11px;
      border: 1px solid rgba(200, 155, 75, 0.55);
      border-radius: 50%;
      opacity: 0;
      animation: beanFloat 2.4s ease-out infinite;
    }

    .coffee-bean::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 1px;
      width: 1px;
      height: 7px;
      background: rgba(200, 155, 75, 0.45);
      transform: rotate(18deg);
    }

    .coffee-bean.one {
      left: 16%;
      top: 58%;
      animation-delay: 900ms;
    }

    .coffee-bean.two {
      right: 13%;
      top: 42%;
      transform: scale(.7);
      animation-delay: 1.25s;
    }

    @keyframes openingReveal {
      0% {
        opacity: 0;
        transform: scale(0.82) translateY(16px);
      }
      20% {
        opacity: 1;
      }
      100% {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

    @keyframes ringReveal {
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes textReveal {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes slowSpin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes beanFloat {
      0% {
        opacity: 0;
        transform: translateY(12px) rotate(-35deg);
      }
      30% {
        opacity: 0.7;
      }
      100% {
        opacity: 0;
        transform: translateY(-28px) rotate(35deg);
      }
    }

    @keyframes steamRise {
      0% {
        opacity: 0;
        transform: translate(-50%, 15px) scaleX(1);
      }
      35% {
        opacity: 0.75;
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -30px) scaleX(2);
      }
    }

    @keyframes logoPop {
      0% {
        opacity: 0;
        transform: scale(0.72) rotate(-4deg);
        filter: brightness(1.25);
      }
      70% {
        opacity: 1;
        transform: scale(1.04) rotate(1deg);
      }
      100% {
        opacity: 1;
        transform: scale(1) rotate(0);
        filter: brightness(1);
      }
    }

    @keyframes loadingProgress {
      from {
        transform: scaleX(0);
      }
      to {
        transform: scaleX(1);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .opening-mark,
      .logo-wrap::before,
      .logo-wrap img,
      .brand-name,
      .brand-tagline,
      .steam,
      .opening-progress::before {
        animation-duration: 1ms;
        animation-delay: 0ms;
      }

      .opening-animation {
        transition-duration: 1ms;
      }
    }
  </style>
</head>
<body>
  <div class="opening-animation" id="openingAnimation" aria-label="Nagbubukas ang A. Keopi Cafe">
    <div class="opening-mark">
      <div class="logo-wrap">
        <span class="steam"></span>
        <span class="steam second"></span>
        <span class="coffee-bean one"></span>
        <span class="coffee-bean two"></span>
        <img src="./A-keopicafe-logo.jpg" alt="A. Keopi Cafe logo">
      </div>
      <div class="brand-name">A. KEOPI CAFE</div>
      <div class="brand-tagline">Freshly Brewed</div>
    </div>
    <div class="opening-progress" aria-hidden="true"></div>
  </div>

  <main class="app">
    <div class="app-card">
      <img src="./A-keopicafe-logo.jpg" alt="" width="140">
      <h1>A. Keopi Cafe</h1>
      <p>POS ready</p>
    </div>
  </main>

  <button class="install-app" id="installApp" type="button" aria-label="I-install ang app">
    <span aria-hidden="true">↓</span>
    I-install sa apps
  </button>

  <script>
    const opening = document.getElementById("openingAnimation");
    const installButton = document.getElementById("installApp");
    let installPrompt = null;
    let openingTimer = null;

    function finishOpening() {
      window.clearTimeout(openingTimer);
      opening.classList.add("finish");
      document.body.classList.add("app-ready");

      window.setTimeout(() => {
        opening.remove();
      }, 700);
    }

    function startOpeningAnimation() {
      if (!opening || opening.classList.contains("finish")) return;

      const duration = window.matchMedia("(prefers-reduced-motion: reduce)").matches
        ? 120
        : 2700;

      openingTimer = window.setTimeout(finishOpening, duration);
    }

    window.addEventListener("load", startOpeningAnimation, { once: true });

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
      installButton.classList.add("visible");
    });

    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;

      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.classList.remove("visible");
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.classList.remove("visible");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>

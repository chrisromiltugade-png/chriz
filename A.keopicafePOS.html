<!DOCTYPE html>
<html lang="fil">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#133824">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="A. Keopi POS">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon.png">
  <link rel="apple-touch-icon" href="./icon.png">
  <title>A. Keopi Cafe POS</title>
  <style>
    :root {
      --cream: #fdfbf7;
      --green: #133824;
      --gold: #c89b4b;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      overflow: hidden;
      background: var(--cream);
      color: var(--green);
      font-family: Arial, sans-serif;
    }

    .app {
      min-height: 100vh;
      display: grid;
      place-items: center;
      opacity: 1;
      transform: scale(1);
    }

    .app-card {
      text-align: center;
    }

    .app-card h1 {
      margin: 12px 0 4px;
      font-size: clamp(28px, 6vw, 48px);
    }

    .app-card p {
      margin: 0;
      color: #6b6253;
    }

    .install-app {
      position: fixed;
      right: 18px;
      bottom: 18px;
      z-index: 900;
      display: none;
      align-items: center;
      gap: 8px;
      border: 0;
      border-radius: 999px;
      padding: 12px 18px;
      background: var(--green);
      color: white;
      font: 700 14px Arial, sans-serif;
      box-shadow: 0 10px 28px rgba(19, 56, 36, 0.24);
      cursor: pointer;
    }

    .install-app.visible {
      display: flex;
      animation: installReveal 400ms ease both;
    }

    @keyframes installReveal {
      from {
        opacity: 0;
        transform: translateY(10px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

  </style>
</head>
<body>
  <main class="app">
    <div class="app-card">
      <img src="./A-keopicafe-logo.jpg" alt="" width="140">
      <h1>A. Keopi Cafe</h1>
      <p>POS ready</p>
    </div>
  </main>

  <button class="install-app" id="installApp" type="button" aria-label="I-install ang app">
    <span aria-hidden="true">↓</span>
    I-install sa apps
  </button>

  <script>
    const installButton = document.getElementById("installApp");
    let installPrompt = null;

    window.addEventListener("beforeinstallprompt", event => {
      event.preventDefault();
      installPrompt = event;
      installButton.classList.add("visible");
    });

    installButton.addEventListener("click", async () => {
      if (!installPrompt) return;

      installPrompt.prompt();
      await installPrompt.userChoice;
      installPrompt = null;
      installButton.classList.remove("visible");
    });

    window.addEventListener("appinstalled", () => {
      installPrompt = null;
      installButton.classList.remove("visible");
    });

    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker.register("./sw.js").catch(() => {});
      });
    }
  </script>
</body>
</html>
